<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC / STUDIO — Tobías Coria</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505; --s1: #0a0a0a; --s2: #111; 
  --text: #eae6dd; --gold: #C8A96E; --muted: rgba(234,230,221,0.4);
  --border: rgba(255,255,255,0.08);
  --fd: 'Cormorant Garamond', serif; --fb: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--fb); overflow-x: hidden; line-height: 1.6; }

/* ── 1. INTRO SCANLINE (ESTILO ROCKSTAR VI) ── */
.scan-overlay {
  position: fixed; inset: 0; z-index: 10000; background: var(--bg);
  pointer-events: none; clip-path: inset(0 0 0 0);
  transition: clip-path 1.4s cubic-bezier(.8, 0, .2, 1) 1.2s;
}
.scan-overlay.done { clip-path: inset(100% 0 0 0); }
.scan-overlay::after {
  content: ''; position: absolute; left: 0; right: 0; height: 2px;
  background: var(--gold); box-shadow: 0 0 15px var(--gold);
  animation: scanline 1.2s ease-in forwards;
}
@keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

/* ── 2. LOADER ORIGINAL (TU ANIMACIÓN) ── */
#loader {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .5s;
}
#loader.hidden { opacity: 0; pointer-events: none; }
.loader-logo { font-family: var(--fd); font-size: 2rem; font-weight: 600; letter-spacing: 0.12em; color: var(--text); }
.loader-dot { color: var(--gold); }

/* ── 3. REVELADO "ROCKSTAR" (CLIP-PATH) ── */
.reveal-mask {
  opacity: 0; clip-path: inset(0 100% 0 0);
  transition: clip-path 1.5s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s;
}
.reveal-mask.in { opacity: 1; clip-path: inset(0 0 0 0); }

.cinema-line {
  width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transform: scaleX(0); transition: transform 2s cubic-bezier(0.19, 1, 0.22, 1);
  margin: 3rem 0;
}
.cinema-line.in { transform: scaleX(1); }

/* ── HERO ── */
.hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 5vw; position: relative; }
.hero-bg-word { 
  position: absolute; top: 10%; left: -2%; font-family: var(--fd); 
  font-size: 28vw; font-weight: 600; color: rgba(255,255,255,0.015); 
  white-space: nowrap; pointer-events: none;
}
.hero-name { font-family: var(--fd); font-size: clamp(4rem, 15vw, 12rem); line-height: 0.85; position: relative; }
.glitch-active { animation: glitch 0.5s steps(2) infinite; color: var(--gold); }
@keyframes glitch {
  0% { transform: translate(-3px); clip-path: inset(10% 0 80% 0); }
  50% { transform: translate(3px); clip-path: inset(80% 0 10% 0); }
  100% { transform: translate(0); }
}

/* ── GRID DE IMÁGENES PRO ── */
.pj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 3rem; }
.pj-item { 
  position: relative; aspect-ratio: 16/9; overflow: hidden; background: var(--s1); 
  cursor: zoom-in; border: 1px solid var(--border);
}
.pj-item img { 
  width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.5) brightness(0.8);
  transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s;
}
.pj-item:hover img { transform: scale(1.1); filter: grayscale(0) brightness(1); }

/* ── LIGHTBOX (PARA VER LAS FOTOS) ── */
#lbModal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 11000;
  display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s;
}
#lbModal.active { display: flex; opacity: 1; }
#lbImg { max-width: 92%; max-height: 85vh; border: 1px solid var(--border); transform: scale(0.9); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
#lbModal.active #lbImg { transform: scale(1); }
.lb-close { position: absolute; top: 30px; right: 30px; color: var(--gold); font-size: 2rem; cursor: pointer; font-family: var(--fb); }

</style>
</head>
<body>

<div class="scan-overlay" id="scanOverlay"></div>

<div id="lbModal" onclick="this.classList.remove('active')">
  <span class="lb-close">✕</span>
  <img id="lbImg" src="">
</div>

<div id="loader">
  <div class="loader-logo" id="loader-logo"></div>
</div>

<section class="hero">
  <div class="hero-bg-word">CORIA</div>
  <div class="reveal-mask">
    <span style="color: var(--gold); letter-spacing: 5px; text-transform: uppercase; font-size: 0.7rem;">Rosario / Argentina</span>
    <h1 class="hero-name" id="heroName">Tobías<br>Coria<span style="color:var(--gold)">.</span></h1>
  </div>
</section>

<div class="cinema-line"></div>

<section class="sec" id="reciente">
  <h2 class="s-title reveal-mask" style="font-family: var(--fd); font-size: 3.5rem;">Trabajo <em>Reciente</em></h2>
  
  <div class="pj-grid">
    <div class="pj-item reveal-mask" onclick="openLB('tu-foto-1.jpg')">
      <img src="tu-foto-1.jpg" alt="Gym System">
    </div>
    <div class="pj-item reveal-mask" style="transition-delay: 0.1s" onclick="openLB('tu-foto-2.jpg')">
      <img src="tu-foto-2.jpg" alt="Branding">
    </div>
    <div class="pj-item reveal-mask" style="transition-delay: 0.2s" onclick="openLB('tu-foto-3.jpg')">
      <img src="tu-foto-3.jpg" alt="Web App">
    </div>
  </div>
</section>

<script>
  // ── 1. TU ANIMACIÓN DE LOADER ORIGINAL ──
  const loaderEl = document.getElementById('loader');
  const logoEl = document.getElementById('loader-logo');
  const text = 'tobias.coria';
  let i = 0;
  const typ = setInterval(() => {
    if (i < text.length) {
      const char = text[i];
      if (char === '.') logoEl.innerHTML += '<span class="loader-dot">.</span>';
      else logoEl.innerHTML += char;
      i++;
    } else { clearInterval(typ); }
  }, 120);

  // Sincronización con el Scanline de Rockstar
  setTimeout(() => {
    loaderEl.classList.add('hidden');
    document.getElementById('scanOverlay').classList.add('done');
    
    // Efecto Glitch en el nombre justo después de entrar
    setTimeout(() => {
      const hN = document.getElementById('heroName');
      hN.classList.add('glitch-active');
      setTimeout(() => hN.classList.remove('glitch-active'), 600);
    }, 1000);
  }, 2200); // Un poco más de tiempo para que termine tu tipeo

  // ── 2. LIGHTBOX FUNCIONAL ──
  function openLB(src) {
    const modal = document.getElementById('lbModal');
    document.getElementById('lbImg').src = src;
    modal.classList.add('active');
  }

  // ── 3. SCROLL REVEAL (ESTILO MÁSCARA) ──
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting) e.target.classList.add('in');
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.reveal-mask, .cinema-line').forEach(el => obs.observe(el));

  // ── 4. PARALLAX SUAVE ──
  window.addEventListener('scroll', () => {
    const txt = document.querySelector('.hero-bg-word');
    txt.style.transform = `translateY(${window.scrollY * 0.35}px)`;
  });
</script>

</body>
</html>
