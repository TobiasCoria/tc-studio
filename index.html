<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC / STUDIO — Tobías Coria</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505; --s1: #0a0a0a; --s2: #111;
  --text: #eae6dd; --gold: #C8A96E; --muted: rgba(234,230,221,0.4);
  --border: rgba(255,255,255,0.08);
  --fd: 'Cormorant Garamond', serif; --fb: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--fb); overflow-x: hidden; line-height: 1.6; }

/* ── 1. SCANLINE OVERLAY (TRANSICIÓN CINEMATOGRÁFICA) ── */
.scan-overlay {
  position: fixed; inset: 0; z-index: 10000; background: var(--bg);
  pointer-events: none; clip-path: inset(0 0 0 0);
  transition: clip-path 1.4s cubic-bezier(.8, 0, .2, 1) 1.2s;
}
.scan-overlay.done { clip-path: inset(100% 0 0 0); }
.scan-overlay::after {
  content: ''; position: absolute; left: 0; right: 0; height: 2px;
  background: var(--gold); box-shadow: 0 0 20px var(--gold);
  animation: scanline 1.2s ease-in forwards;
}
@keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

/* ── 2. LOADER CON TU LÓGICA DE TIPEO ── */
#loader {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .5s;
}
#loader.hidden { opacity: 0; pointer-events: none; }
.loader-logo { font-family: var(--fd); font-size: 2rem; font-weight: 600; letter-spacing: 0.12em; color: var(--text); }
.loader-dot { color: var(--gold); }

/* ── 3. REVELADO ROCKSTAR (CLIP-PATH ANIMATION) ── */
.reveal-mask {
  opacity: 0; clip-path: inset(0 100% 0 0); /* Empieza cerrado */
  transition: clip-path 1.5s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s;
}
.reveal-mask.in { opacity: 1; clip-path: inset(0 0 0 0); } /* Se abre */

.cinema-line {
  width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transform: scaleX(0); transition: transform 2s cubic-bezier(0.19, 1, 0.22, 1);
  margin: 4rem 0;
}
.cinema-line.in { transform: scaleX(1); }

/* ── HERO ── */
.hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 8vw 5vw; position: relative; }
.hero-bg-word { 
  position: absolute; top: 15%; left: -2%; font-family: var(--fd); 
  font-size: 30vw; font-weight: 600; color: rgba(255,255,255,0.012); 
  white-space: nowrap; pointer-events: none;
}
.hero-name { font-family: var(--fd); font-size: clamp(4rem, 15vw, 12rem); line-height: 0.85; position: relative; }

.glitch-active { animation: glitch 0.6s steps(2) forwards; color: var(--gold); }
@keyframes glitch {
  0% { transform: translate(-5px); clip-path: inset(10% 0 80% 0); }
  30% { transform: translate(5px); clip-path: inset(80% 0 10% 0); }
  50% { transform: translate(-2px); color: #fff; }
  100% { transform: translate(0); clip-path: inset(0); }
}

/* ── GRID DE PROYECTOS (ESTILO VI) ── */
.pj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 4rem; }
.pj-item { 
  position: relative; aspect-ratio: 16/9; overflow: hidden; background: var(--s1); 
  cursor: pointer; border: 1px solid var(--border);
}
.pj-item img { 
  width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.4) brightness(0.7);
  transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s;
}
.pj-item:hover img { transform: scale(1.05); filter: grayscale(0) brightness(1); }

.pj-info {
  position: absolute; bottom: 0; left: 0; padding: 2rem;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  width: 100%; transform: translateY(10px); transition: transform 0.5s;
}
.pj-item:hover .pj-info { transform: translateY(0); }

/* ── SECCIONES ── */
.sec { padding: 10rem 5vw; border-top: 1px solid var(--border); }
.s-tag { font-size: 0.7rem; color: var(--gold); letter-spacing: 5px; text-transform: uppercase; margin-bottom: 1.5rem; display: block; }
.s-title { font-family: var(--fd); font-size: clamp(2.5rem, 7vw, 6rem); font-weight: 300; line-height: 1; }

</style>
</head>
<body>

<div class="scan-overlay" id="scanOverlay"></div>

<div id="loader">
  <div class="loader-logo" id="loader-logo"></div>
</div>

<section class="hero">
  <div class="hero-bg-word">CORIA</div>
  <div class="reveal-mask">
    <span class="s-tag">Rosario / Argentina</span>
    <h1 class="hero-name" id="heroName">Tobías<br>Coria<span style="color:var(--gold)">.</span></h1>
  </div>
</section>

<div class="cinema-line"></div>

<section class="sec">
  <span class="s-tag">Portfolio</span>
  <h2 class="s-title reveal-mask">Proyectos que<br><em>elevan</em> marcas.</h2>
  
  <div class="pj-grid">
    <div class="pj-item reveal-mask">
      <img src="tu-imagen-1.jpg" alt="Proyecto">
      <div class="pj-info">
        <h3 style="font-family: var(--fd); font-size: 1.5rem;">Nombre del Proyecto</h3>
        <p style="font-size: 0.8rem; color: var(--gold);">Web Development / Design</p>
      </div>
    </div>
    
    <div class="pj-item reveal-mask" style="transition-delay: 0.2s;">
      <img src="tu-imagen-2.jpg" alt="Proyecto">
      <div class="pj-info">
        <h3 style="font-family: var(--fd); font-size: 1.5rem;">Sistema de Gestión</h3>
        <p style="font-size: 0.8rem; color: var(--gold);">Full Stack App</p>
      </div>
    </div>
  </div>
</section>

<script>
  // ── 1. TU LÓGICA DE TIPEO (PRESERVADA) ──
  const loaderEl = document.getElementById('loader');
  const logoEl = document.getElementById('loader-logo');
  const text = 'tobias.coria';
  let i = 0;
  const typ = setInterval(() => {
    if (i < text.length) {
      const char = text[i];
      if (char === '.') logoEl.innerHTML += '<span class="loader-dot">.</span>';
      else logoEl.innerHTML += char;
      i++;
    } else { clearInterval(typ); }
  }, 120);

  // ── 2. SINCRONIZACIÓN CON EL REVELADO ──
  setTimeout(() => {
    loaderEl.classList.add('hidden');
    document.getElementById('scanOverlay').classList.add('done');
    
    // El Glitch ocurre justo después de que la web se revela
    setTimeout(() => {
      const hN = document.getElementById('heroName');
      if(hN) {
        hN.classList.add('glitch-active');
        setTimeout(() => hN.classList.remove('glitch-active'), 800);
      }
    }, 2000);
  }, 2500);

  // ── 3. INTERSECTION OBSERVER (PARA EL SCROLL "ROCKSTAR") ──
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting) {
        e.target.classList.add('in');
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.reveal-mask, .cinema-line').forEach(el => obs.observe(el));

  // ── 4. PARALLAX SUAVE DEL FONDO ──
  window.addEventListener('scroll', () => {
    const bg = document.querySelector('.hero-bg-word');
    if(bg) {
      let scroll = window.pageYOffset;
      bg.style.transform = `translateY(${scroll * 0.4}px)`;
    }
  }, { passive: true });
</script>

</body>
</html>
